name: build-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created if missing; defaults to the latest existing tag)"
        required: false
        type: string
      draft:
        description: "Publish the release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and project version
        id: resolve
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*project(lsd2dsl[[:space:]][[:space:]]*VERSION[[:space:]][[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          version=${version%%$'\n'*}
          [ -n "$version" ] || { echo "::error::cannot parse project version from CMakeLists.txt"; exit 1; }

          tag="$(printf '%s' "${TAG_INPUT:-}" | tr -d '[:space:]')"
          if [ -z "$tag" ]; then
            tags=$(git tag --list --sort=-v:refname)
            tag=${tags%%$'\n'*}
            [ -n "$tag" ] || { echo "::error::repository has no tags and no tag input was given"; exit 1; }
            echo "No tag input; using latest existing tag: $tag"
          else
            case "$tag" in
              -*|*' '*|*'..'*|*'~'*|*'^'*|*':'*|*'?'*|*'*'*|*'['*|*'\'*) echo "::error::invalid tag name: $tag"; exit 1;;
            esac
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists; artifacts will be overwritten"
            else
              echo "Tag $tag does not exist; it will be created at $GITHUB_SHA"
            fi
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### lsd2dsl $version -> $tag" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            libboost-program-options-dev libfmt-dev zlib1g-dev \
            libsndfile1-dev libvorbis-dev libogg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            qt6-webengine-dev qt6-webengine-dev-tools qt6-pdf-dev \
            libgl1-mesa-dev libxkbcommon-dev libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2t64 fuse3 file desktop-file-utils
          # Qt6Core5Compat package name differs between releases
          sudo apt-get install -y qt6-5compat-dev || sudo apt-get install -y libqt6core5compat6-dev

      - name: Configure and build
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_DUDEN=ON
          cmake --build build --target lsd2dsl -j"$(nproc)"

      - name: Fetch linuxdeploy
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy-x86_64.AppImage "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/lib/qt6/bin/qmake6
          EXTRA_PLATFORM_PLUGINS: libqxcb.so
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/tools:/usr/lib/qt6/bin:$PATH"
          LD=$RUNNER_TEMP/tools/linuxdeploy-x86_64.AppImage
          rm -rf AppDir
          "$LD" --plugin qt \
            --appdir AppDir \
            -d scripts/appimage/lsd2dsl.desktop \
            -e build/app/lsd2dsl \
            -i scripts/appimage/lsd2dsl.svg

          # QtWebEngine runtime bits the qt plugin may not pick up from the distro layout
          arch_libexec=/usr/lib/x86_64-linux-gnu/qt6/libexec
          mkdir -p AppDir/usr/resources AppDir/usr/libexec AppDir/usr/translations
          if [ -d /usr/share/qt6/resources ]; then
            cp -an /usr/share/qt6/resources/. AppDir/usr/resources/ || true
          fi
          if [ -x "$arch_libexec/QtWebEngineProcess" ]; then
            cp -an "$arch_libexec/QtWebEngineProcess" AppDir/usr/libexec/ || true
          fi
          if [ -d /usr/share/qt6/translations/qtwebengine_locales ]; then
            cp -an /usr/share/qt6/translations/qtwebengine_locales AppDir/usr/translations/ || true
          fi
          test -f AppDir/usr/resources/v8_context_snapshot.bin || \
            echo "::warning::v8_context_snapshot.bin missing from AppDir"

          "$LD" --appdir AppDir --output appimage
          libc=$(ldd --version | sed -n '1s/.*[^0-9]\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
          out="lsd2dsl-${VERSION}-x86_64.glibc_${libc}.AppImage"
          mv lsd2dsl*-x86_64.AppImage "$out"
          chmod +x "$out"
          mkdir -p dist && mv "$out" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: prepare
    runs-on: macos-26
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          brew update --quiet
          brew install cmake boost qt qtwebengine fmt libsndfile libvorbis libogg

      - name: Build
        run: make build BUILD_TYPE=RelWithDebInfo

      - name: Package .app bundle
        run: |
          set -euxo pipefail
          QT_PREFIX="$(brew --prefix qt)"
          APP=dist/lsd2dsl.app
          rm -rf dist && mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/app/lsd2dsl "$APP/Contents/MacOS/lsd2dsl"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>lsd2dsl</string>
            <key>CFBundleIdentifier</key><string>org.lsd2dsl.lsd2dsl</string>
            <key>CFBundleName</key><string>lsd2dsl</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>$(sw_vers -productVersion | cut -d. -f1).0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          "$QT_PREFIX/bin/macdeployqt" "$APP" -always-overwrite -no-strip
          # ad-hoc signature: unsigned relocated dylibs are killed by arm64 codesign enforcement
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          arch=$(uname -m)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/lsd2dsl-${VERSION}-macos-${arch}.zip"
          rm -rf "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TRIPLET: x64-windows
      VCPKG_PACKAGES: boost-program-options fmt zlib libogg libvorbis libsndfile[core,external-libs,mpeg]
      QT_ROOT: C:\Qt
      BUILD_CONFIG: RelWithDebInfo
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install vcpkg dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) { throw "vcpkg not found at $env:VCPKG_ROOT" }
          $pkgs = $env:VCPKG_PACKAGES -split ' '
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET --recurse @pkgs
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-windows-${{ env.QT_VERSION }}-msvc2022_64-webengine

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet aqtinstall
          $mods = @('qt5compat','qtwebengine','qtwebchannel','qtpositioning','qtpdf')
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -m @mods -O $env:QT_ROOT
          if ($LASTEXITCODE -ne 0) {
            Write-Host "retrying without the qtpdf module (bundled with qtwebengine in some releases)"
            $mods = $mods | Where-Object { $_ -ne 'qtpdf' }
            python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -m @mods -O $env:QT_ROOT
            if ($LASTEXITCODE -ne 0) { throw "aqt install-qt failed" }
          }

      - name: Set up MSVC environment
        run: |
          $ErrorActionPreference = 'Stop'
          # The VS generator name is version-bound; vswhere + vcvars64 works for any
          # installed Visual Studio (2022, 2026, Build Tools) and feeds Ninja instead.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $installs = & $vswhere -latest -prerelease -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsPath = @($installs)[0]
          if (-not $vsPath) {
            Write-Host (& $vswhere -all -prerelease -products * -format json)
            throw "no Visual Studio instance with the x64 C++ toolset"
          }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "using $vsPath"

          $skip = '^(GITHUB_|RUNNER_|ACTIONS_|_$)'
          & cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ($name -notmatch $skip) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }

      - name: Configure and build
        run: |
          $ErrorActionPreference = 'Stop'
          $qt6 = "$env:QT_ROOT\$env:QT_VERSION\msvc2022_64"
          if (-not (Test-Path $qt6)) { throw "Qt not found at $qt6" }
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=$env:BUILD_CONFIG `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DENABLE_DUDEN=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET `
            -DQt6_ROOT=$qt6 `
            -DCMAKE_PREFIX_PATH=$qt6
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build --target lsd2dsl
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Package ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build
          cpack -G ZIP -C $env:BUILD_CONFIG
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "cpack failed" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zips = @(Get-ChildItem build\*.zip)
          if ($zips.Count -eq 0) { throw "cpack produced no archive" }
          $zips | Move-Item -Destination dist -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no artifacts to upload"; exit 1; }
          ls -l "${files[@]}"

          draft_flag=()
          if [ "${DRAFT:-false}" = "true" ]; then draft_flag=(--draft); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; overwriting artifacts"
          else
            # gh reuses an existing tag; --target only applies when the tag is created
            gh release create "$TAG" \
              --title "lsd2dsl $TAG" \
              --notes "lsd2dsl ${VERSION} — automated build from ${GITHUB_SHA}." \
              --target "$GITHUB_SHA" \
              "${draft_flag[@]}"
          fi

          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
